      const dest = {
        id: d.id,
        country: d.country,
        name: d.name,
        regionDisplay: `${d.country} • ${d.sub}`,
        travelPhotos: makeTravelPhotos(d.id, d.name, d.travel),
        pilgrimages: []
      };
      
      let globalIndex = 1; // 用于跨电影累加图片编号
      d.pilg.forEach(p => {
        for (let i = 0; i < p.count; i++) {
          dest.pilgrimages.push({
            work: p.work,
            title: `${p.work} — Scene ${i + 1}`, // 显示文字仍然从1开始
            filmSrc: `assets/travel/${d.id}/film-${globalIndex}.jpg`, // 真实路径连续递增
            realSrc: `assets/travel/${d.id}/real-${globalIndex}.jpg`
          });
          globalIndex++;
        }
      });
      return dest;
    });

    // 严格匹配 ECharts 地图内的名称（加入 China）
    const echartsVisitedCountries = [
      "Austria", "Czech Rep.", "United Kingdom", "Hungary",
      "United Arab Emirates", "Taiwan", "Singapore", "Malaysia",
      "Canada", "Japan", "United States", "China"
    ];

    // =====================================================================
    // 2. 初始化 ECharts 地图
    // =====================================================================
    const chartDom = document.getElementById('world-map');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

    Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json').then(res => res.json()),
    ]).then(([worldJson]) => {
      echarts.registerMap('world', worldJson);

      // 构建 regions 数据
      const regionsData = echartsVisitedCountries.map(c => ({
        name: c,
        itemStyle: {
          areaColor: 'rgba(30, 58, 138, 0.6)', // 深蓝色
          borderColor: '#3B82F6',
          borderWidth: 1
        }
      }));

      const option = {
        backgroundColor: 'transparent',
        geo: {
          map: 'world',
          roam: true,
          zoom: 1.2,
          center: [15, 25],
          itemStyle: {
            areaColor: '#111827', // 默认背景色（灰色）
            borderColor: 'rgba(255,255,255,0.05)',
            borderWidth: 0.5
          },
          emphasis: {
            itemStyle: { areaColor: '#1f2937' },
            label: { show: false }
          },
          select: {
            itemStyle: {
              areaColor: 'rgba(96, 165, 250, 0.8)', // 选中时的亮蓝色
              borderColor: '#60A5FA',
              borderWidth: 1
            },
            label: { show: false }
          },
          selectedMode: 'single',
          regions: regionsData
        },
        series: [
          {
            type: 'scatter',
            coordinateSystem: 'geo',
            symbolSize: 6,
            itemStyle: {
              color: '#60A5FA',
              shadowBlur: 10,
              shadowColor: '#3B82F6'
            },
            data: cityData.map(d => ({
              name: d.name,
              value: d.coord,
              destId: d.id
            })),
            emphasis: {
              scale: 1.5,
              label: { show: true, formatter: '{b}', color: '#fff', fontSize: 11, fontFamily: 'JetBrains Mono', distance: 4 }
            }
          }
        ]
      };

      myChart.setOption(option);

      myChart.on('click', function (params) {
        if (params.seriesType === 'scatter' && params.data && params.data.destId) {
          selectDestination(params.data.destId);
          return;
        }
        const countryDest = destinations.find(d => d.country === params.name);
        if (countryDest) {
          selectDestination(countryDest.id);
        }
      });
    });

    window.addEventListener('resize', () => { myChart.resize(); });

    // =====================================================================
    // 3. 渲染下方的画廊
    // =====================================================================
    let activeDestinationId = null;

    window.selectDestination = function(id) {
      activeDestinationId = id;
      renderShowcase();
      document.getElementById("destination-showcase").scrollIntoView({ behavior: "smooth", block: "start" });
    };

    function renderShowcase() {
      const container = document.getElementById("destination-showcase");
      const dest = destinations.find(d => d.id === activeDestinationId);
      if (!dest) { container.innerHTML = ""; return; }

      let html = `
        <div class="glass-panel rounded-3xl p-6 md:p-10">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/10 pb-6 mb-8">
            <div>
              <div class="font-mono text-xs text-rose-400 uppercase tracking-widest mb-1">${dest.regionDisplay}</div>
              <h2 class="text-3xl md:text-4xl font-bold text-white">${dest.name}</h2>
            </div>
          </div>
      `;

      if (dest.travelPhotos.length > 0) {
        html += `
          <div class="mb-12">
            <h3 class="font-mono text-xs text-gray-400 uppercase tracking-widest mb-6">Travel Frames</h3>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${dest.travelPhotos.map(photo => `
                <article onclick="openLightbox('${photo.src}', '${photo.title}')" ...
                  class="photo-card group cursor-pointer rounded-2xl overflow-hidden bg-white/5 border border-white/10">
                  <div class="aspect-[4/3] bg-slate-800 relative overflow-hidden">
                    <img src="${photo.src}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMzAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM2YjcyODAiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtc2l6ZT0iMTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='" />
                  </div>
                  
                  <div class="p-4 flex justify-between items-center font-mono text-[11px] text-gray-400">
                    <span id="thumb-date-${photo.id}">Reading...</span>
                    <span id="thumb-cam-${photo.id}">Reading...</span>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      if (dest.pilgrimages.length > 0) {
        html += `
          <div>
            <h3 class="font-mono text-xs text-rose-400 uppercase tracking-widest mb-6">Cinematic Pilgrimage</h3>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${dest.pilgrimages.map((item, idx) => `
                <article class="rounded-2xl overflow-hidden bg-white/5 border border-white/10">
                  <div class="compare-box aspect-video w-full bg-slate-900" style="--pos: 82%;">
                    <img src="${item.filmSrc}" class="w-full h-full object-cover pointer-events-none" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMjI1Ij48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMjcxYjFkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM5Y2ExYTMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtc2l6ZT0iMTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkZpbG0gU2NlbmU8L3RleHQ+PC9zdmc+'" />
                    <div class="compare-real-layer">
                      <img src="${item.realSrc}" class="w-full h-full object-cover pointer-events-none" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMjI1Ij48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM5Y2ExYTMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtc2l6ZT0iMTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlJlYWwgUGhvdG88L3RleHQ+PC9zdmc+'" />
                    </div>
                    <div class="compare-divider"></div>
                    <div class="compare-handle">↔</div>
                  </div>
                  <div class="p-4 font-mono text-[11px] text-gray-300">
                    <div class="text-rose-300/80 mb-1">${item.work}</div>
                    <div class="text-white">${item.title}</div>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;
      // 异步读取缩略图的 EXIF 信息并更新到卡片上
      dest.travelPhotos.forEach(photo => {
        exifr.parse(photo.src, ['DateTimeOriginal', 'CreateDate', 'Make', 'Model']).then(exif => {
          const dateEl = document.getElementById(`thumb-date-${photo.id}`);
          const camEl = document.getElementById(`thumb-cam-${photo.id}`);
          if (!exif) throw new Error("No exif");

          if (dateEl) {
            if (exif.DateTimeOriginal || exif.CreateDate) {
              const d = exif.DateTimeOriginal || exif.CreateDate;
              dateEl.textContent = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
            } else {
              dateEl.textContent = "Unknown Date";
            }
          }
          
          if (camEl) {
            if (exif.Make || exif.Model) {
              let make = exif.Make || "";
              let model = exif.Model || "";
              // 把 "Apple iPhone 16 Pro" 简写成 "iPhone 16 Pro"
              let camStr = model.startsWith(make) ? model : (make + " " + model).trim();
              camEl.textContent = camStr.replace("Apple ", "");
            } else {
              camEl.textContent = "Unknown Cam";
            }
          }
        }).catch(e => {
          const dateEl = document.getElementById(`thumb-date-${photo.id}`);
          const camEl = document.getElementById(`thumb-cam-${photo.id}`);
          if (dateEl) dateEl.textContent = "No EXIF";
          if (camEl) camEl.textContent = "-";
        });
      });
      // =====================================================================

      bindCompareSliders(); // 这是原本最后一行
    }

    function bindCompareSliders() {
      document.querySelectorAll(".compare-box").forEach(box => {
        const updatePos = (clientX) => {
          const rect = box.getBoundingClientRect();
          let pct = ((clientX - rect.left) / rect.width) * 100;
          box.style.setProperty("--pos", `${Math.max(0, Math.min(100, pct))}%`);
        };
        let dragging = false;
        box.addEventListener("pointerdown", (e) => { dragging = true; box.setPointerCapture(e.pointerId); updatePos(e.clientX); });
        box.addEventListener("pointermove", (e) => { if (dragging) updatePos(e.clientX); });
        box.addEventListener("pointerup", () => { dragging = false; });
      });
    }

    // =====================================================================
    // 4. Lightbox 放大逻辑（带防卡死保护和 EXIF 读取）
    // =====================================================================
    window.openLightbox = function(src, title) {
      // 1. 立即弹出窗口
      document.getElementById("lb-title").textContent = title;
      const dateEl = document.getElementById("lb-date");
      const cameraEl = document.getElementById("lb-camera");
      const lensEl = document.getElementById("lb-lens");
      const apertureEl = document.getElementById("lb-aperture");
      const isoEl = document.getElementById("lb-iso");
      
      dateEl.textContent = "Reading...";
      cameraEl.textContent = "Reading...";
      lensEl.textContent = "Reading...";
      apertureEl.textContent = "Reading...";
      isoEl.textContent = "Reading...";
      document.getElementById("lb-path").textContent = src;

      document.getElementById("lb-media").innerHTML = `
        <img src="${src}" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl pointer-events-auto" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iNjAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM2YjcyODAiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4='" />
      `;
      document.getElementById("photo-lightbox").classList.remove("hidden");

      // 2. 定义一个失败/超时的兜底显示
      const showError = (msg) => {
        dateEl.textContent = msg;
        cameraEl.textContent = "-";
        lensEl.textContent = "-";
        apertureEl.textContent = "-";
        isoEl.textContent = "-";
      };

      // 3. 检查解析库是否加载成功
      if (typeof exifr === 'undefined') {
        console.error("EXIF 库未加载！请检查网络或 CDN。");
        showError("Library Missing");
        return;
      }

      // 4. 读取 EXIF（加入超时机制防止卡死）
      let isFinished = false;
      
      // 设置 1.5 秒超时
      const timeoutId = setTimeout(() => {
        if (!isFinished) {
          isFinished = true;
          console.warn("读取超时，可能是照片没有 EXIF 或网络问题");
          showError("No EXIF Data");
        }
      }, 1500);

      exifr.parse(src, ['DateTimeOriginal', 'Make', 'Model', 'FNumber', 'FocalLength', 'ISO', 'LensModel']).then(exif => {
        if (isFinished) return;
        isFinished = true;
        clearTimeout(timeoutId);

        if (!exif || Object.keys(exif).length === 0) {
          showError("No EXIF Data");
          return;
        }

        // 1. 日期（不变）
        let dateStr = "Unknown";
        if (exif.DateTimeOriginal || exif.CreateDate) {
          const d = exif.DateTimeOriginal || exif.CreateDate;
          dateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
        }

        // 2. 相机（不变）
        let cameraStr = "Unknown";
        if (exif.Make || exif.Model) {
          cameraStr = ((exif.Make || "") + " " + (exif.Model || "")).trim();
        }

        // --- 修改这里 ---
        let isApple = (exif.Make || "").toLowerCase().includes("apple");
        let lensStr = "Unknown Lens";

        if (isApple) {
            lensStr = "35mm"; // 如果是 iPhone，直接暴力写死 35mm
        } else {
            // 相机（索尼等）正常读取等效或物理焦距
            let focal = exif.FocalLengthIn35mmFormat || exif.FocalLength;
            let focalStr = focal ? Math.round(focal) + "mm " : "";
            let lensModel = exif.LensModel || "Unknown Lens";
            
            if (focalStr && !lensModel.includes("mm")) {
                lensStr = focalStr + lensModel;
            } else {
                lensStr = lensModel;
            }
        }
        
        if (lensStr.length > 32) {
           lensStr = lensStr.substring(0, 32) + "...";
        }
        // -----------------

        // 4. 光圈（修复长串小数）
        let apertureStr = "Unknown";
        if (exif.FNumber) {
           let roundedF = Math.round(exif.FNumber * 10) / 10;
           apertureStr = "f/" + roundedF;
        }

        // 5. ISO
        let isoStr = exif.ISO ? "ISO " + exif.ISO : "Unknown";

        // 更新到页面
        dateEl.textContent = dateStr;
        cameraEl.textContent = cameraStr;
        lensEl.textContent = lensStr.trim();
        apertureEl.textContent = apertureStr;
        isoEl.textContent = isoStr;

      }).catch(err => {
        if (isFinished) return;
        isFinished = true;
        clearTimeout(timeoutId);
        console.warn("EXIF 解析失败: ", err);
        showError("No EXIF Data");
      });
    };

    window.closeLightbox = function(event, force = false) {
      if (force || (event && event.target.id === 'photo-lightbox')) {
        document.getElementById("photo-lightbox").classList.add("hidden");
      }
    };
  </script>
</body>
</html>
